<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Overview</title>
<style>
  :root {
    --paper: #f6f3ee; --ink: #1c1917; --muted: #57534e; --soft: #78716c;
    --rule: rgba(28,25,23,0.12); --accent: #ea580c; --blue: #2563eb;
    --teal: #0f766e; --green: #15803d; --rose: #be123c; --violet: #6d28d9;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: system-ui, "Segoe UI", sans-serif;
    padding: 48px 32px 88px; max-width: 880px; margin: 0 auto;
    font-size: 16px; line-height: 1.5;
  }
  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
  h1 { font-size: 28px; font-weight: 700; line-height: 1.2; margin-bottom: 12px; }
  .roles { font-size: 14px; color: var(--muted); margin-bottom: 12px; }
  .roles strong { color: var(--ink); }
  section { margin-bottom: 48px; }
  h2 { font-size: 20px; font-weight: 700; margin: 0 0 8px; }
  .why { font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 10px; }
  .why.orange { color: var(--accent); } .why.blue { color: var(--blue); } .why.teal { color: var(--teal); }
  .why.rose { color: var(--rose); } .why.violet { color: var(--violet); } .why.green { color: var(--green); }
  .q { font-size: 15px; color: var(--muted); margin-bottom: 14px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 640px) { .cards { grid-template-columns: 1fr; } }
  .kcard { border-radius: 8px; padding: 14px 16px; font-size: 14px; }
  .kcard h3 { font-size: 13px; font-weight: 700; margin-bottom: 6px; }
  .kcard p { color: var(--muted); font-size: 13px; }
  .kcard.base { background: #dbeafe; } .kcard.bug { background: #ffe4e6; }
  .kcard.code { background: #dcfce7; } .kcard.job { background: #ffedd5; }
  pre {
    background: #1c1917; color: #fef3c7; font-family: ui-monospace, Consolas, monospace;
    font-size: 12px; line-height: 1.5; padding: 14px 16px; border-radius: 8px;
    overflow-x: auto; margin: 12px 0 0;
  }
  pre .c { color: #86efac; } pre .k { color: #93c5fd; }
  table.pick { width: 100%; border-collapse: collapse; }
  .pick th, .pick td { text-align: left; padding: 10px 12px 10px 0; border-bottom: 1px solid var(--rule); font-size: 14px; vertical-align: top; }
  .pick th { font-size: 12px; text-transform: uppercase; color: var(--soft); font-weight: 700; }
  .pick td.type { font-weight: 700; color: var(--blue); white-space: nowrap; padding-right: 16px; }
  .here { color: var(--accent); font-size: 12px; font-weight: 700; }
  code { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: var(--teal); }
  .mermaid { background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 12px; overflow-x: auto; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  button { font: inherit; font-size: 14px; padding: 8px 12px; border: 1px solid var(--rule); background: #fff; border-radius: 6px; cursor: pointer; color: var(--ink); }
  button:hover { border-color: var(--ink); }
  button.on { background: var(--blue); color: #fff; border-color: var(--blue); }
  button.on.orange { background: var(--accent); border-color: var(--accent); }
  .panel { background: #fff; border-left: 4px solid var(--blue); border-radius: 8px; padding: 12px 16px; margin-top: 10px; font-size: 14px; color: var(--muted); }
  .panel strong { color: var(--ink); }
  .panel.orange { border-left-color: var(--accent); } .panel.rose { border-left-color: var(--rose); }
  .panel.green { border-left-color: var(--green); } .panel.violet { border-left-color: var(--violet); }
  .panel.teal { border-left-color: var(--teal); }
  .owns-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; }
  @media (min-width: 640px) { .owns-grid { grid-template-columns: 1fr 1fr 1fr; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
  .chip { font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 8px; background: #e7e5e4; color: var(--muted); }
  .chip.cur.queued { background: #dbeafe; color: var(--blue); }
  .chip.cur.processing { background: #ffedd5; color: var(--accent); }
  .chip.cur.completed { background: #dcfce7; color: var(--green); }
  .chip.cur.stopped { background: #ede9fe; color: var(--violet); }
  .chip.cur.error { background: #ffe4e6; color: var(--rose); }
  .log { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--soft); margin-top: 8px; }
  .lecture { margin: 14px 0 0; font-size: 15px; }
  .lecture p { color: var(--muted); margin: 0 0 10px; }
  .unverified { background: #fef3c7; border-radius: 8px; padding: 14px 16px; margin-top: 12px; font-size: 14px; }
  .unverified h3 { font-size: 13px; font-weight: 700; color: #a16207; margin-bottom: 8px; }
  .unverified li { margin: 0 0 6px 18px; color: var(--muted); }
  details.qa { background: #fff; border: 1px solid var(--rule); border-left: 4px solid var(--blue); border-radius: 8px; margin: 0 0 10px; max-width: 720px; }
  details.qa.ticket { border-left-color: var(--accent); }
  details.qa summary { cursor: pointer; list-style: none; padding: 12px 16px; font-weight: 600; font-size: 15px; }
  details.qa summary::-webkit-details-marker { display: none; }
  details.qa summary::after { content: " — bấm để xem"; font-weight: 500; color: var(--soft); font-size: 12px; }
  details.qa[open] summary::after { content: " — ẩn"; }
  details.qa .sug { padding: 12px 16px 14px; font-size: 14px; color: var(--muted); border-top: 1px solid var(--rule); }
  details.qa .sug strong { color: var(--ink); }
  .err { padding: 24px; color: var(--rose); }
</style>
</head>
<body>
<div id="root"></div>
<script src="overview-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<script>
(function () {
  const D = window.OVERVIEW_DATA;
  const root = document.getElementById("root");
  if (!D) {
    root.innerHTML = "<p class='err'>Missing overview-data.js (<code>window.OVERVIEW_DATA</code>). Copy the HTML template and write data only.</p>";
    return;
  }
  document.title = D.title || "Overview";
  if (D.lang) document.documentElement.lang = D.lang;

  if (window.mermaid) {
    mermaid.initialize({ startOnLoad: false, theme: "neutral", securityLevel: "loose", flowchart: { curve: "linear", htmlLabels: false } });
  }
  let drawId = 0;
  async function draw(el, src) {
    if (!el || !src) return;
    if (!window.mermaid) { el.textContent = src; return; }
    drawId += 1;
    const { svg } = await mermaid.render("m" + drawId, src);
    el.innerHTML = svg;
  }
  function paras(ps) {
    if (!ps || !ps.length) return "";
    return "<div class='lecture'>" + ps.map((p) => "<p>" + p + "</p>").join("") + "</div>";
  }
  function lecture(section) {
    if (!section) return "";
    if (Array.isArray(section)) return paras(section);
    const id = section.topic;
    const mode = (id && D.depth && D.depth[id]) || "";
    if (mode === "recap") return paras(section.recap || section.lecture);
    return paras(section.lecture);
  }
  function pre(html) { return html ? "<pre>" + html + "</pre>" : ""; }

  let html = "";
  html += "<p class='eyebrow'>" + (D.eyebrow || "") + "</p>";
  html += "<h1>" + (D.title || "") + "</h1>";
  html += "<p class='roles'>" + (D.roles || "") + "</p>";
  if (D.how) html += "<p class='q'>" + D.how + "</p>";

  if (D.catalog && D.catalog.rows) {
    html += "<section><p class='why blue'>" + (D.catalog.why || "") + "</p>";
    html += "<h2>" + (D.catalog.heading || "") + "</h2>";
    if (D.catalog.q) html += "<p class='q'>" + D.catalog.q + "</p>";
    html += "<table class='pick'><thead><tr><th>Need</th><th>Use</th><th>Here</th></tr></thead><tbody>";
    D.catalog.rows.forEach((r) => {
      html += "<tr><td>" + r.need + "</td><td class='type'>" + r.use + "</td><td>" + r.here + "</td></tr>";
    });
    html += "</tbody></table></section>";
  }

  if (D.owns && D.owns.items) {
    html += "<section><p class='why teal'>" + (D.owns.why || "Owns") + "</p>";
    html += "<h2>" + (D.owns.heading || "") + "</h2>";
    html += "<p class='q'>" + (D.owns.q || "") + "</p>";
    html += "<div class='row' id='owns-btns'></div>";
    html += "<div class='owns-grid' id='owns-grid'></div>";
    html += lecture(D.owns) + "</section>";
  }

  if (D.arch) {
    html += "<section><p class='why orange'>" + (D.arch.why || "Architecture") + "</p>";
    html += "<h2>" + (D.arch.heading || "") + "</h2>";
    html += "<p class='q'>" + (D.arch.q || "") + "</p>";
    html += "<div class='row'><button type='button' id='btn-now' class='on'>Now</button><button type='button' id='btn-after'>After</button></div>";
    html += "<div class='mermaid' id='arch-view'></div><div class='panel orange' id='arch-note'></div><pre id='arch-code'></pre>";
    html += lecture(D.arch) + "</section>";
  }
  if (D.seq) {
    html += "<section><p class='why blue'>" + (D.seq.why || "Sequence") + "</p>";
    html += "<h2>" + (D.seq.heading || "") + "</h2>";
    html += "<p class='q'>" + (D.seq.q || "") + "</p>";
    html += "<div class='mermaid' id='seq-view'></div>";
    html += "<div class='row'><button type='button' id='seq-back'>Back</button><button type='button' id='seq-next'>Next</button><button type='button' id='seq-reset'>Reset</button></div>";
    html += "<div class='panel' id='seq-note'></div>" + pre(D.seq.code) + lecture(D.seq) + "</section>";
  }
  if (D.state) {
    html += "<section><p class='why violet'>" + (D.state.why || "State") + "</p>";
    html += "<h2>" + (D.state.heading || "") + "</h2>";
    html += "<p class='q'>" + (D.state.q || "") + "</p>";
    html += "<div class='mermaid' id='state-view'></div><div class='chips' id='state-chips'></div>";
    html += "<div class='row'><button type='button' data-ev='consume'>Consume</button><button type='button' data-ev='ok'>Handle OK</button><button type='button' data-ev='timeout'>Timeout</button><button type='button' data-ev='exc'>Exception</button><button type='button' data-ev='reset'>Reset</button></div>";
    html += "<div class='panel violet' id='state-note'></div><p class='log' id='state-log'></p>" + pre(D.state.code) + lecture(D.state) + "</section>";
  }
  if (D.die) {
    html += "<section><p class='why rose'>" + (D.die.why || "What-if") + "</p>";
    html += "<h2>" + (D.die.heading || "") + "</h2>";
    html += "<p class='q'>" + (D.die.q || "") + "</p>";
    html += "<div class='row'><button type='button' data-world='now'>Now · process died</button><button type='button' data-world='after'>After · process died</button></div>";
    html += "<div class='panel rose' id='die-note'></div>" + pre(D.die.code) + lecture(D.die) + "</section>";
  }
  if (D.process) {
    html += "<section><p class='why green'>" + (D.process.why || "Process") + "</p>";
    html += "<h2>" + (D.process.heading || "") + "</h2>";
    html += "<p class='q'>" + (D.process.q || "") + "</p>";
    html += "<div class='mermaid' id='pb-view'></div><div class='row' id='pb-btns'></div>";
    html += "<div class='panel green' id='pb-note'></div>" + pre(D.process.code) + lecture(D.process) + "</section>";
  }
  if (D.qa && D.qa.groups) {
    html += "<section><p class='why blue'>" + (D.qa.why || "Q&amp;A") + "</p>";
    html += "<h2>" + (D.qa.heading || "") + "</h2>";
    if (D.qa.q) html += "<p class='q'>" + D.qa.q + "</p>";
    D.qa.groups.forEach((g) => {
      html += "<p class='why " + (g.ticket ? "orange" : "teal") + "' style='margin-top:28px'>" + g.label + "</p>";
      g.items.forEach((it) => {
        html += "<details class='qa" + (g.ticket ? " ticket" : "") + "'><summary>" + it.ask + "</summary><p class='sug'>" + it.sug + "</p></details>";
      });
    });
    html += "</section>";
  }
  if (D.accumulate) {
    html += "<section><p class='why orange'>" + (D.accumulate.why || "Accumulate") + "</p>";
    html += "<h2>" + (D.accumulate.heading || "") + "</h2>";
    if (D.accumulate.q) html += "<p class='q'>" + D.accumulate.q + "</p>";
    html += "<div class='cards'>";
    (D.accumulate.cards || []).forEach((c) => {
      html += "<article class='kcard " + c.kind + "'><h3>" + c.title + "</h3><p>" + c.body + "</p></article>";
    });
    html += "</div>";
    if (D.accumulate.unverified && D.accumulate.unverified.length) {
      html += "<div class='unverified'><h3>Unverified — not spec / plan / implement</h3><ul>";
      D.accumulate.unverified.forEach((u) => { html += "<li>" + u + "</li>"; });
      html += "</ul></div>";
    }
    html += "</section>";
  }
  root.innerHTML = html;

  (async function bind() {
    if (D.owns && D.owns.items) {
      const btns = document.getElementById("owns-btns");
      const grid = document.getElementById("owns-grid");
      const items = D.owns.items;
      btns.innerHTML = items.map((it, i) => "<button type='button' data-owns='" + i + "'>" + it.label + "</button>").join("");
      function showOwns(i) {
        const it = items[i];
        btns.querySelectorAll("button").forEach((b, j) => b.classList.toggle("on", j === i));
        grid.innerHTML =
          "<article class='kcard code'><h3>Phụ trách</h3><p>" + (it.owns || "") + "</p></article>" +
          "<article class='kcard base'><h3>Không phụ trách</h3><p>" + (it.not || "") + "</p></article>" +
          "<article class='kcard bug'><h3>Lỗi hay mắc</h3><p>" + (it.miss || "") + "</p></article>";
      }
      btns.querySelectorAll("[data-owns]").forEach((b) => {
        b.onclick = () => showOwns(Number(b.getAttribute("data-owns")));
      });
      grid.innerHTML = "<article class='kcard job'><h3>Bấm một box</h3><p>" + (D.owns.prompt || "Mỗi component: owns / not / typical miss.") + "</p></article>";
    }
    if (D.arch) {
      async function setArch(which) {
        const a = D.arch[which];
        document.getElementById("btn-now").classList.toggle("on", which === "now");
        document.getElementById("btn-after").classList.toggle("on", which === "after");
        document.getElementById("arch-note").innerHTML = a.note || "";
        document.getElementById("arch-code").innerHTML = a.code || "";
        await draw(document.getElementById("arch-view"), a.mermaid);
      }
      document.getElementById("btn-now").onclick = () => setArch("now");
      document.getElementById("btn-after").onclick = () => setArch("after");
      await setArch("now");
    }
    if (D.seq && D.seq.steps) {
      let i = 0;
      async function setSeq(n) {
        i = Math.max(0, Math.min(D.seq.steps.length - 1, n));
        document.getElementById("seq-note").innerHTML = D.seq.steps[i].note || "";
        await draw(document.getElementById("seq-view"), D.seq.steps[i].mermaid);
      }
      document.getElementById("seq-back").onclick = () => setSeq(i - 1);
      document.getElementById("seq-next").onclick = () => setSeq(i + 1);
      document.getElementById("seq-reset").onclick = () => setSeq(0);
      await setSeq(0);
    }
    if (D.state) {
      await draw(document.getElementById("state-view"), D.state.mermaid);
      const trans = D.state.trans || {};
      const order = D.state.chips || ["queued", "processing", "completed", "stopped", "error"];
      let cur = D.state.start || "queued";
      const chips = document.getElementById("state-chips");
      const note = document.getElementById("state-note");
      const log = document.getElementById("state-log");
      function paint() {
        chips.innerHTML = order.map((s) => "<span class='chip" + (s === cur ? " cur " + s : "") + "'>" + s + "</span>").join("");
      }
      function fire(ev) {
        if (ev === "reset") {
          cur = D.state.start || "queued";
          note.innerHTML = D.state.resetNote || "";
          log.textContent = "";
          paint();
          return;
        }
        const next = (trans[cur] || {})[ev];
        if (!next) {
          note.innerHTML = "<strong>No.</strong> From <code>" + cur + "</code> that event is not allowed.";
          return;
        }
        log.textContent = cur + " + " + ev + " → " + next[0];
        cur = next[0];
        note.innerHTML = "<strong>" + cur + ".</strong> " + next[1];
        paint();
      }
      document.querySelectorAll("[data-ev]").forEach((b) => { b.onclick = () => fire(b.getAttribute("data-ev")); });
      fire("reset");
    }
    if (D.die) {
      const el = document.getElementById("die-note");
      el.innerHTML = D.die.prompt || "";
      document.querySelectorAll("[data-world]").forEach((b) => {
        b.onclick = () => {
          document.querySelectorAll("[data-world]").forEach((x) => x.classList.remove("on", "orange"));
          b.classList.add("on", "orange");
          const w = b.getAttribute("data-world");
          el.innerHTML = D.die[w] || "";
          el.className = "panel " + (w === "now" ? "rose" : "green");
        };
      });
    }
    if (D.process) {
      await draw(document.getElementById("pb-view"), D.process.mermaid);
      const btns = document.getElementById("pb-btns");
      const stages = D.process.stages || {};
      btns.innerHTML = Object.keys(stages).map((k) => "<button type='button' data-stage='" + k + "'>" + (D.process.labels && D.process.labels[k] || k) + "</button>").join("");
      const note = document.getElementById("pb-note");
      note.innerHTML = D.process.prompt || "";
      btns.querySelectorAll("[data-stage]").forEach((b) => {
        b.onclick = () => {
          btns.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
          b.classList.add("on");
          note.innerHTML = stages[b.getAttribute("data-stage")] || "";
        };
      });
    }
  })();
})();
</script>
</body>
</html>
